services:
  - type: web
    name: hireready-techcheck
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: HIREREADY_BRAND_NAME
        value: HireReady TechCheck
      - key: HIREREADY_BRAND_TAGLINE
        value: AI-powered interview readiness and technical support
